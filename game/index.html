<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Detective">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Detective Deduction</title>
<style>
  :root{--cork:url(assets/ui/cork.webp);--paper:url(assets/ui/paper.webp);--manila:#f3d58e;--ink:#2e3a59;--stamp:#e0524d;--bg:#fff8ec;--card:#ffffff;--card2:#fff3d6;--text:#2a2418;--muted:#7a7055;--fact:#3fb27f;--lie:#e05d5d;--unk:#e0b14b;--accent:#4f8df7;--gold:#ffb703;--r:16px;--line:#f0e2c2;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  .top{flex:none;height:calc(48px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;gap:8px;padding-left:8px;padding-right:12px;background:#fff;border-bottom:2px solid var(--line)}
  .top .ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .brand{font-weight:800;font-size:19px;padding-left:6px}.top .brand-sub{margin-left:auto;color:var(--gold);font-weight:700}
  .tbtn{background:none;border:0;color:var(--accent);font-size:16px;font-weight:600;padding:8px 6px;cursor:pointer}
  .main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
  .main.nopad{padding:0;overflow:hidden}
  .tabbar{flex:none;display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:var(--sab);min-height:calc(58px + var(--sab))}
  .tab{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
  .tab svg{width:24px;height:24px}.tab.on{color:var(--accent)}.tab.on svg{background:#e3f0ff;border-radius:10px;padding:2px}.tab:disabled{opacity:.3}
  .tabnote{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  h1{font-size:22px;margin:4px 0 6px}h2{font-size:16px;margin:16px 0 6px}h3{font-size:15px;margin:12px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 10px}.dim{color:var(--muted);font-size:13px}.gold{color:var(--gold)}.hint{color:var(--muted);font-size:13px;text-align:center;grid-column:1/-1;margin:8px 0}
  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}.card.center{text-align:center}.card p{margin:0 0 8px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.35}.btn.ghost{background:#eee4cc;color:var(--text)}.btn.big{width:100%;padding:15px;font-size:16px;margin-top:10px}
  .loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);color:var(--text)}
  .loading .lg{font-size:54px;animation:pulse 1.2s ease-in-out infinite}.loading b{font-size:20px}
  .loading .bar{width:60%;max-width:280px;height:10px;border-radius:999px;background:#f0e2c2;overflow:hidden}.loading .bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .2s}
  .loading span{color:var(--muted);font-size:13px}
  /* hub */
  .cases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cs{background:var(--card);border-radius:16px;overflow:hidden;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);cursor:pointer;padding:0;text-align:left;color:var(--text)}
  .cs:active{border-color:var(--accent)}.cs .thumb{aspect-ratio:16/9;position:relative;background:#cfe3f2}.cs .thumb svg{position:absolute;inset:0;width:100%;height:100%}
  .cs .num{position:absolute;top:6px;left:6px;background:var(--gold);color:#2b2000;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
  .cs .body{padding:8px 10px 10px}.cs b{font-size:14px;display:block}.cs small{color:var(--muted);font-size:12px;display:block}
  .stx{color:var(--gold);font-size:14px;letter-spacing:2px;display:block;margin-top:2px}.stx .off{opacity:.2}
  /* stage */
  .stage{position:relative;width:100%;height:100%;overflow:hidden;background:#cfe3f2}
  .stage svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .stage.intro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.6));pointer-events:none}
  .intro-card{position:absolute;left:14px;right:14px;bottom:16px;z-index:2;background:rgba(255,252,245,.96);border-radius:var(--r);padding:16px;border:2px solid var(--gold)}
  .intro-card p{margin:0 0 8px;font-size:15px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .legend .f::before{background:var(--fact)}.legend .l::before{background:var(--lie)}.legend .u::before{background:var(--unk)}
  .chip{background:rgba(255,252,245,.95);color:var(--text);border:2px solid var(--gold);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;backdrop-filter:blur(3px)}
  .top-chip{position:absolute;left:10px;right:10px;top:10px;z-index:3;text-align:center}
  .hot{position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;padding:0;text-align:center}
  .hot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
  .hot .nm{display:inline-block;margin-top:-4px;background:#fff;color:var(--text);border:1.5px solid var(--gold);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .hot .ic{position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .hot .ic.w{background:var(--accent)}.hot .ic.s{background:var(--unk);color:#2b2000}.hot.done .ic{background:var(--fact);color:#06261a}
  .hot.pulse svg{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* scene wide shot */
  .stage.scene{container-type:size;background:#f3e7cf}
  .stage.scene .blurbg{position:absolute;inset:-20px;filter:blur(14px) saturate(1.1);opacity:.75;transform:scale(1.1)}
  .stage.scene .blurbg svg{position:absolute;inset:0;width:100%;height:100%}
  .room{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);aspect-ratio:1/1;width:min(100cqw,calc(100cqh * 1));border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(90,70,30,.25);container-type:size}
  @container (min-aspect-ratio: 1/1){ .room{aspect-ratio:16/9;width:min(100cqw,calc(100cqh * 16 / 9));top:50%;border-radius:0} }
  @container (max-aspect-ratio: 1/1){ .room{width:100cqw} }
  .room svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .room .hot .nm{font-size:10px;padding:1px 6px}
  @container (max-aspect-ratio: 1/1){ .room .hot{transform:translate(-50%,-100%) scale(.82);transform-origin:50% 100%} }
  .room .hot .ic{width:18px;height:18px;font-size:11px}
  /* interview (ADV format) */
  .actor{position:absolute;left:3%;bottom:24%;height:66%;max-width:52%;z-index:2;display:flex;align-items:flex-end;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transition:opacity .2s}
  .actor svg{height:100%;width:auto;max-width:100%}
  .tbox{position:absolute;left:10px;right:10px;bottom:10px;height:27%;min-height:130px;max-height:210px;z-index:5;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(243,240,252,.96));border:3px solid #e6e1f4;border-radius:34px;box-shadow:0 6px 18px rgba(60,50,90,.18),inset 0 0 0 2px rgba(255,255,255,.8);padding:28px 26px 14px;cursor:pointer}
  .tbox .name{position:absolute;top:-20px;left:28px;min-width:120px;text-align:center;background:linear-gradient(180deg,#6d7ea8,#3f4f78);color:#fff;font-weight:800;font-size:16px;padding:7px 26px;border-radius:999px;border:2px solid #dfe6ff;box-shadow:0 3px 8px rgba(40,50,90,.3)}
  .tbox .name::before,.tbox .name::after{content:"✦";position:absolute;top:5px;color:#dfe6ff;font-size:14px}.tbox .name::before{left:9px}.tbox .name::after{right:9px}
  .tbox .name.you{background:linear-gradient(180deg,#ffd466,#e0a400);color:#2b2000}
  .tbox .txt{font-size:19px;line-height:1.5;color:#3a3448;font-weight:600;max-height:calc(100% - 4px);overflow:hidden}
  .tbox .adv{position:absolute;right:22px;bottom:12px;color:#6d7ea8;font-size:14px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .menu{position:absolute;right:16px;bottom:calc(27% + 22px);width:56%;max-width:360px;z-index:6;display:none;flex-direction:column;gap:6px}
  .menu.on{display:flex}
  .menu button{background:linear-gradient(180deg,#fffaf0,#fff0c2);color:#5a4210;border:2.5px solid #f2c744;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 3px 0 #d9a92c,0 4px 10px rgba(0,0,0,.2)}
  .menu button:disabled{opacity:.5;box-shadow:none}.menu button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9a92c}.menu button.leave{background:linear-gradient(180deg,#f3f8ff,#dbe9ff);border-color:var(--accent);color:#1f3a6e;box-shadow:0 3px 0 #4f7ad9,0 4px 10px rgba(0,0,0,.25)}
  .menu .markrow{background:rgba(255,250,240,.96);border:2px solid #f2c744;border-radius:14px;padding:8px 10px;color:#2a2418;font-size:13px;font-weight:700;text-align:center}
  .menu .markrow .marks button{background:#e6dcbd;color:#2a2418;border-radius:10px;box-shadow:none}
  .banner{position:absolute;top:10px;left:10px;z-index:7;display:flex;align-items:center;gap:8px;background:rgba(255,252,245,.97);border-left:4px solid var(--fact);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;max-width:70%}
  .banner.on{opacity:1}.banner.stmt{border-left-color:var(--unk)}.banner.note{border-left-color:var(--muted)}
  .banner svg{width:24px;height:24px;flex:none}
  .marks{display:flex;gap:6px;margin-top:6px}
  .marks button{flex:1;border:0;border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;background:#eee4cc;color:var(--text);cursor:pointer}
  .marks button.fact.on{background:var(--fact);color:#06261a}.marks button.lie.on{background:var(--lie);color:#2b0a0a}.marks button.unknown.on{background:var(--unk);color:#2b2000}
  @media (min-aspect-ratio: 1/1){
    .actor{left:6%;bottom:22%;height:74%;max-width:38%}
    .menu{width:40%;max-width:420px;bottom:calc(26% + 26px);right:24px}
    .menu button{font-size:16px;padding:12px 14px}
    .tbox{height:26%;max-height:200px;padding:30px 36px 14px;left:16px;right:16px}
    .actor{bottom:19%}
    .tbox .txt{font-size:22px}
    .tbox .name{font-size:16px;left:24px}
  }
  /* notebook sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;background:#fffdf7;border-top:3px solid var(--gold);color:#2a2418;border-radius:18px 18px 0 0;z-index:30;transform:translateY(110%);transition:transform .25s;box-shadow:0 -8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;padding-bottom:var(--sab)}
  .sheet.open{transform:translateY(0)}
  .sheet .hd{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px dashed #c8bd9c;position:relative}
  .sheet .grab{position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:#c8bd9c;transform:translateX(-50%)}
  .sheet .hd b{font-size:15px;margin-top:8px}.sheet .tabs{display:flex;gap:6px;margin-top:8px;margin-left:auto}
  .sheet .tabs button{border:0;background:#e6dcbd;color:#2a2418;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px}
  .sheet .tabs button.on{background:#2a2418;color:#f6efd9}
  .sheet .x{border:0;background:#e6dcbd;border-radius:8px;padding:6px 9px;margin-top:8px;cursor:pointer}
  .sheet .bd{overflow:auto;padding:10px 14px 20px;-webkit-overflow-scrolling:touch}
  .ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #e0d6b8;font-size:14px}
  .ev svg{width:30px;height:30px;flex:none}.ev b{color:#7a5a12}.ev.hl,.st.hl{background:#ffe9a8;border-radius:8px;padding:8px}.ev.note{color:#7a7055;font-style:italic}
  .st{padding:8px 0;border-bottom:1px solid #e0d6b8;font-size:14px}.st .marks button{background:#e6dcbd;color:#2a2418}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#c8bd9c;vertical-align:middle}
  .dot.fact{background:var(--fact)}.dot.lie{background:var(--lie)}.dot.unknown{background:var(--unk)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}.scrim.on{display:block}
  .toast{position:fixed;left:50%;top:calc(56px + var(--sat));transform:translateX(-50%);background:#2a2418;color:#f6efd9;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  /* verdict / result */
  .pick{display:flex;flex-direction:column;gap:8px}
  .pick button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);font-size:16px;text-align:left;cursor:pointer}
  .pick button svg{width:56px;height:auto;flex:none}.pick button.on{border-color:var(--accent)}
  .wrongcard{border-left:4px solid var(--lie)}
  .row2{display:flex;gap:12px;align-items:flex-end}.row2 svg{width:84px;height:auto;flex:none}.row2 h2{margin:0 0 8px}
  .bubble{background:#fff3d6;color:var(--text);border-radius:14px;padding:10px 12px;font-size:15px;flex:1}
  .stars{font-size:46px;letter-spacing:4px;margin:4px 0;color:var(--gold)}.stars .off{opacity:.2}.score{font-size:30px;font-weight:800}
  .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .tag.fact{background:var(--fact);color:#06261a}.tag.lie{background:var(--lie);color:#2b0a0a}.tag.unknown{background:var(--unk);color:#2b2000}
  .res{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:6px}.ok{color:var(--fact);font-weight:700}.bad{color:var(--lie);font-weight:700}
  .row{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.row p{margin:0 0 6px}

  /* ===== Case Files theme ===== */
  .typ{font-family:"Special Elite","Courier New",monospace;letter-spacing:.3px}
  .top{background:#fffaf0 url() ;border-bottom:3px solid #e8c983;box-shadow:0 2px 0 #f6e3b5}
  .top .ttl{font-family:"Special Elite",monospace;font-weight:400;font-size:17px;color:var(--ink)}
  .tbtn{font-family:"Fredoka";color:var(--ink);background:#f3d58e;border-radius:10px;padding:6px 10px;font-size:14px;box-shadow:0 2px 0 #d9b25c}
  .main.cork{background:#e9cfa0 var(--cork);background-size:256px}
  .brandrow{display:flex;align-items:center;gap:8px;padding-left:4px}.brandrow img{width:32px;height:auto}
  .brandrow .brand{font-family:"Special Elite",monospace;font-weight:400;font-size:19px;color:var(--ink)}
  .top .brand-sub{font-family:"Fredoka";color:#c48a00}
  .hub-head{display:flex;align-items:center;gap:12px;background:#fffaf0;border-radius:6px;padding:12px 14px;margin:2px 4px 16px;box-shadow:0 4px 0 rgba(0,0,0,.08),0 6px 14px rgba(80,50,10,.25);transform:rotate(-1deg);position:relative}
  .hub-head img.badge{width:56px}.hub-head b{font-family:"Special Elite";font-size:20px;color:var(--ink);display:block}.hub-head span{font-size:13px;color:#7a6440}
  .hub-head .pin{position:absolute;top:-14px;left:50%;width:22px}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px 18px;padding:6px 8px 10px}
  .fold{position:relative;border:0;background:none;padding:0;cursor:pointer;aspect-ratio:640/504;container-type:inline-size;filter:drop-shadow(0 6px 8px rgba(80,50,10,.35));transition:transform .15s}
  .fold:nth-child(odd){transform:rotate(-2deg)}.fold:nth-child(even){transform:rotate(1.5deg)}
  .fold:active{transform:scale(.97)}
  .fold>img.f{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .fold .lbl{position:absolute;left:11%;top:4.6%;font-family:"Special Elite";font-size:4.2cqw;color:var(--ink)}
  .fold .photo{position:absolute;left:10%;top:22%;width:44%;aspect-ratio:1/0.82;background:#fff;padding:1.4cqw 1.4cqw 3.6cqw;transform:rotate(-4deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
  .fold .photo svg{width:100%;height:100%;display:block}
  .fold .photo img.tape{position:absolute;top:-3cqw;left:22%;width:56%}
  .fold .info{position:absolute;left:58%;right:6%;top:24%;text-align:left}
  .fold .info b{font-family:"Fredoka";font-weight:700;font-size:6.4cqw;line-height:1.15;color:var(--ink);display:block}
  .fold .info small{display:block;font-size:4.3cqw;color:#7a6440;margin-top:3px}
  .fold .stars{position:absolute;left:10%;bottom:12%;font-size:8cqw;letter-spacing:1px;color:#ffb703;text-shadow:0 1px 0 #a36a00}.fold .stars .off{color:#d8c08a;text-shadow:none}
  .fold.locked{cursor:default;filter:grayscale(.85) brightness(.92) drop-shadow(0 6px 8px rgba(80,50,10,.25))}.fold.locked .photo,.fold.locked .info{opacity:.55}
  .fold .lockd{position:absolute;right:10%;bottom:12%;font-size:12cqw;line-height:1}
  .fold .solved{position:absolute;right:9%;bottom:12%;font-family:"Special Elite";color:var(--stamp);border:.9cqw solid var(--stamp);border-radius:1.6cqw;padding:.4cqw 2.4cqw;font-size:7cqw;transform:rotate(-10deg);opacity:.88;letter-spacing:.5cqw}
  .fold .pin{position:absolute;top:-3cqw;right:18%;width:6cqw}
  .hint.cork{color:#5a4210;background:#fffaf0;display:inline-block;padding:4px 10px;border-radius:4px;transform:rotate(-1deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  /* tab bar */
  .tabbar{background:#fffaf0;border-top:3px solid #e8c983}
  .tab{font-family:"Fredoka";color:#7a6440;font-size:12px}
  .tab img{width:34px;height:34px;transition:transform .15s}.tab.on img{transform:translateY(-3px) scale(1.08)}.tab.on{color:var(--ink)}
  .tab:disabled img{filter:grayscale(1);opacity:.5}
  /* intro */
  .intro-card{left:50%;right:auto;width:min(calc(100% - 28px),660px);transform:translateX(-50%) rotate(-.6deg);border:0;border-radius:4px;padding:20px 20px 18px 62px;box-shadow:0 6px 18px rgba(0,0,0,.3);
    background:linear-gradient(90deg,transparent 46px,rgba(224,82,77,.55) 46px,rgba(224,82,77,.55) 48px,transparent 48px),
      repeating-linear-gradient(180deg,transparent 0,transparent 31px,rgba(91,155,240,.28) 31px,rgba(91,155,240,.28) 32px),#fffaf0;
    font-family:"Courier Prime","Courier New",monospace}
  .intro-card::before,.intro-card::after{content:"";position:absolute;left:16px;width:16px;height:16px;border-radius:50%;background:#e9dfc8;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
  .intro-card::before{top:24%}.intro-card::after{bottom:24%}

  /* ===== notebook drawer (right side) ===== */

  /* case files, rank, promotion */

  .promo-card .chief svg,.promo-card .chief img{width:100%;height:100%;object-fit:contain}

.promo-badge{position:relative;width:140px;height:140px;margin:6px auto;animation:pbadge .9s cubic-bezier(.2,1.6,.4,1) .25s both}

  .promo-card p{margin:6px 0;font-size:16px}.promo-card .rank{font-size:22px;font-weight:700;color:var(--ink)}
  .promo-card .stamped{position:absolute;right:16px;top:58px;font-family:"Special Elite";color:var(--stamp);border:3px solid var(--stamp);border-radius:6px;padding:2px 8px;transform:rotate(12deg);font-size:15px;animation:pstamp .4s ease 1s both}
  @keyframes pfade{from{opacity:0}to{opacity:1}}
  @keyframes pbadge{0%{transform:scale(0) rotate(-200deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

    .intro-card .clip{display:none}
    .intro-card h1{font-size:20px;margin:0 0 4px}.intro-card .sub{font-size:11px}
    .intro-card p{font-size:14px;line-height:1.4;margin:0 0 4px}

    .promo-card h1{font-size:24px;margin:2px 0}.promo-card .rank{font-size:18px}.promo-card p{margin:3px 0;font-size:14px}

  /* ===== portrait phones: ask to rotate ===== */
  #rotate{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#e9cfa0 var(--cork);background-size:256px;font-family:"Fredoka";color:var(--ink)}

  @media (orientation:landscape) and (max-height:520px){ .top{padding-right:250px} .tabbar{right:44px} }
</style>

<body>
<div id="rotate"><div class="card"><div class="ph"></div><b>Turn your phone sideways</b><span>Detective Deduction is played in landscape.</span></div></div>
<button id="fsbtn" aria-label="Full screen" onclick="toggleFull()"><svg viewBox="0 0 24 24" fill="none" stroke="#2a2418" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<button class="nbhandle" id="nbhandle" onclick="openNb()"><img src="assets/ui/tab_1.webp" alt=""><span>NOTES</span></button>
<div class="toast" id="toast"></div>
<script>
/* ================= ART ================= */
var portrait=function(c, mood="neutral"){
  if(c.obj) return objPortrait(c.obj);
  const h=c.tall?0:6, sk=c.skin, hr=c.hair, tp=c.top;
  const styles={
    short:`<path d="M28 ${40+h} q22 -30 44 0 v-6 q-22 -22 -44 0z" fill="${hr}"/>`,
    ponytail:`<path d="M28 ${40+h} q22 -30 44 0 v-6 q-22 -22 -44 0z" fill="${hr}"/><path d="M70 ${38+h} q14 6 10 30 q-6 -10 -12 -14z" fill="${hr}"/>`,
    long:`<path d="M28 ${40+h} q22 -30 44 0 v30 q-6 4 -8 0 v-18 h-28 v18 q-2 4 -8 0z" fill="${hr}"/>`,
    curly:`<g fill="${hr}"><circle cx="32" cy="${36+h}" r="9"/><circle cx="44" cy="${28+h}" r="9"/><circle cx="56" cy="${28+h}" r="9"/><circle cx="68" cy="${36+h}" r="9"/><circle cx="50" cy="${24+h}" r="8"/></g>`,
    cap:`<path d="M26 ${42+h} q24 -26 48 0z" fill="${hr}"/><rect x="22" y="${40+h}" width="56" height="5" rx="2" fill="${hr}"/>`,
    bun:`<path d="M28 ${40+h} q22 -26 44 0 v-4 q-22 -20 -44 0z" fill="${hr}"/><circle cx="50" cy="${24+h}" r="8" fill="${hr}"/>`,
    bald:`<path d="M30 ${40+h} q4 -8 10 -10 M70 ${40+h} q-4 -8 -10 -10" stroke="${hr}" stroke-width="4" fill="none"/>`,
    grey:`<path d="M28 ${40+h} q22 -30 44 0 v-6 q-22 -22 -44 0z" fill="#cfcfcf"/>`,
    beanie:`<path d="M27 ${44+h} q23 -34 46 0z" fill="${hr}"/><rect x="25" y="${40+h}" width="50" height="7" rx="3" fill="${hr}" opacity=".8"/>`
  };
  const hair=styles[c.hairStyle]||styles.short;
  const glasses=c.glasses?`<g fill="none" stroke="#333" stroke-width="2"><circle cx="41" cy="${50+h}" r="6"/><circle cx="59" cy="${50+h}" r="6"/><path d="M47 ${50+h} h6"/></g>`:"";
  const beard=c.beard?`<path d="M34 ${56+h} q16 22 32 0 v6 q-16 16 -32 0z" fill="${hr}"/>`:"";
  const face= mood==="nervous"
    ? `<path d="M36 ${44+h} l10 3 M64 ${44+h} l-10 3" stroke="#333" stroke-width="2" fill="none"/><circle cx="41" cy="${51+h}" r="2.2"/><circle cx="59" cy="${51+h}" r="2.2"/><path d="M43 ${64+h} q7 -4 14 0" stroke="#333" stroke-width="2" fill="none"/><path d="M72 ${42+h} q4 6 0 8 q-4 -2 0 -8z" fill="#6ab0ff"/>`
    : mood==="happy"
    ? `<circle cx="41" cy="${50+h}" r="2.2"/><circle cx="59" cy="${50+h}" r="2.2"/><path d="M41 ${61+h} q9 8 18 0" stroke="#333" stroke-width="2" fill="none"/>`
    : `<circle cx="41" cy="${50+h}" r="2.2"/><circle cx="59" cy="${50+h}" r="2.2"/><path d="M43 ${62+h} q7 4 14 0" stroke="#333" stroke-width="2" fill="none"/>`;
  return `<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M22 120 v-28 q0 -14 14 -16 h28 q14 2 14 16 v28z" fill="${tp}"/>
    <rect x="43" y="${66+h}" width="14" height="12" fill="${sk}"/>
    <circle cx="50" cy="${50+h}" r="20" fill="${sk}"/>${beard}${hair}${face}${glasses}</svg>`;
}
function objPortrait(kind){
  const o={
    receipt:`<rect x="30" y="20" width="40" height="80" fill="#fff" stroke="#555" stroke-width="3"/><path d="M38 35h24M38 48h24M38 61h16M38 74h20" stroke="#3b6fd9" stroke-width="3"/>`,
    camera:`<rect x="20" y="40" width="50" height="34" rx="6" fill="#444"/><circle cx="45" cy="57" r="11" fill="#222" stroke="#8ab" stroke-width="3"/><path d="M70 50 l16 -8 v30 l-16 -8z" fill="#444"/><circle cx="30" cy="48" r="3" fill="#e05d5d"/>`,
    sheet:`<rect x="26" y="18" width="48" height="84" rx="4" fill="#fff" stroke="#555" stroke-width="3"/><rect x="38" y="12" width="24" height="10" rx="3" fill="#8a5a2b"/><path d="M34 40h32M34 52h32M34 64h32M34 76h20" stroke="#555" stroke-width="3"/><path d="M58 78 l4 4 l8 -10" stroke="#3fb27f" stroke-width="3" fill="none"/>`
  }[kind];
  return `<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}
function icon(n){ if(ART.icons&&ART.icons[n]) return `<svg viewBox="0 0 40 40"><image href="${A(ART.icons[n])}" width="40" height="40"/></svg>`; return ICONS[n]; }

let fileExp=null;
function fileOf(n){ return FILES.find(f=>n>=f.from&&n<=f.to); }
function fileCases(f){ return CASES.filter(c=>c.n>=f.from&&c.n<=f.to); }
function caseStars(c){ return (progress[c.id]||{}).stars||0; }
function fileDone(f){ const cs=fileCases(f); return cs.length===f.to-f.from+1 && cs.every(c=>caseStars(c)>0); }
function fileGold(f){ const cs=fileCases(f); return cs.length===f.to-f.from+1 && cs.every(c=>caseStars(c)===3); }
function caseOpen(c){ if(unlockAll||c.n===1) return true; const pv=CASES[c.n-2]; return !!pv&&caseStars(pv)>0; }
function fileOpen(f){ return unlockAll || f.n===1 || fileDone(FILES[f.n-2]); }
function stripeCount(){ let n=0; for(const f of FILES){ if(!fileDone(f)) break; if(f.n>=RANKS.length) n++; } return n; }
function rankObj(){ const r=RANKS[rankIdx()], n=stripeCount(); return Object.assign({},r,{name:r.name+(n?` · ${n} stripe${n>1?'s':''}`:'')}); }
function rankIdx(){ let r=0; for(const f of FILES){ if(fileDone(f)) r=f.n; else break; } return Math.min(r,RANKS.length-1); }

function caseReady(c){ return !!(ART.backgrounds&&ART.backgrounds[c.bg]) && Object.values(c.chars).every(ch=>ART.figures&&ART.figures[ch.key]); }

function startTalk(id){ S.talking=id; S.beats=[{who:id,text:person(id).greet,mood:moodOf(id,"greet")}]; S.bi=-1; S.screen="talk"; S.pendingMark=null; render(); nextBeat(); }
function ask(i){
  const id=S.talking, q=person(id).questions[i];
  S.asked[id+i]=true; S.pendingMark=null; let after=null;
  if(q.ev&&!S.found.includes(q.ev)){ S.found.push(q.ev); after={kind:"ev",id:q.ev}; }
  else if(q.note){ if(!S.notes.includes(q.a)) S.notes.push(q.a+" — "+q.note); after={kind:"note",text:"Noted, but not a card. "+q.note}; }
  else if(q.s&&!S.stmts.includes(q.s.id)){ S.stmts.push(q.s.id); after={kind:"stmt",id:q.s.id}; }
  else if(q.a&&!q.ev){ after={kind:"note",text:"Nothing useful. Try a more precise question."}; }
  S.beats=[{who:id,text:q.a||q.s.text,after,mood:moodOf(id,i)}]; S.bi=-1; hideMenu(); nextBeat();
}
let typer=null;
function nextBeat(){
  if(S.bi<S.beats.length-1){ S.bi++; showBeat(S.beats[S.bi]); }
  else showMenu();
}
function showBeat(b){
  const box=$("tbox"); if(!box) return; if(b.who!=="you") setActor(b.who,b.mood||"neutral");
  const c=b.who==="you"?null:C.chars[b.who];
  box.querySelector(".name").textContent=c?c.name:"You"; box.querySelector(".name").className="name "+(c?"":"you");
  const t=box.querySelector(".txt"); t.textContent=""; box.querySelector(".adv").style.visibility="hidden";
  const full=b.text; let i=0; clearInterval(typer); S.typing=true;
  typer=setInterval(()=>{ i+=2; t.textContent=full.slice(0,i); if(i>=full.length){ endType(); } },18);
  S.cur=b;
  if(b.after){ setTimeout(()=>pickup(b.after), 300); }
}
function endType(){ clearInterval(typer); S.typing=false; const box=$("tbox"); if(!box) return; box.querySelector(".txt").textContent=S.cur.text; if(S.bi>=S.beats.length-1){ setTimeout(()=>{ if(S&&S.screen==="talk"&&!S.typing) showMenu(); },250); } else box.querySelector(".adv").style.visibility="visible"; }
function tapBox(){ if(S.typing){ endType(); return; } if($("menu").classList.contains("on")) return; nextBeat(); }
function pickup(a){
  const bn=$("banner"); if(!bn) return;
  if(a.kind==="ev"){ bn.className="banner on"; bn.innerHTML=`${icon(C.evidence[a.id].icon)}<div><b>${a.id}</b> written in notebook</div>`; }
  else if(a.kind==="stmt"){ bn.className="banner stmt on"; bn.innerHTML=`${ICONS.talk}<div>Statement written down</div>`; S.pendingMark=a.id; }
  else { bn.className="banner note on"; bn.innerHTML=`${ICONS.note}<div>${a.text}</div>`; }
  clearTimeout(bn._t); bn._t=setTimeout(()=>bn.classList.remove("on"),2200);
  updateTabs();
}
function showMenu(){
  const m=$("menu"); if(!m) return; const id=S.talking, p=person(id);
  const done=personDone(id), nxt=nextPerson();
  let mark="";
  if(S.pendingMark){ const st=stmtById(S.pendingMark); mark=`<div class="markrow">Mark this statement<div class="marks">${["fact","lie","unknown"].map(v=>`<button class="${v} ${S.marks[st.id]===v?'on':''}" onclick="event.stopPropagation();setMark('${st.id}','${v}');showMenu()">${LABEL[v]}</button>`).join("")}</div></div>`; }
  const qs=p.questions.map((q,i)=>`<button ${S.asked[id+i]?"disabled":""} onclick="event.stopPropagation();ask(${i})">${S.asked[id+i]?"✓ ":""}${q.q}</button>`).join("");
  const leave=`<button class="leave" onclick="event.stopPropagation();clearInterval(typer);S.screen='scene';render()">${done?"That's all, thanks":"I'll come back later"} ‹ back to the scene</button>`;
  m.innerHTML=mark+qs+leave; m.classList.add("on"); $("tbox").querySelector(".adv").style.visibility="hidden";
}
function hideMenu(){ const m=$("menu"); if(m) m.classList.remove("on"); }
function updateTabs(){ const tb=document.querySelector(".tabbar"); if(tb&&S.screen==="talk") tb.innerHTML=tabsFor("talk"); updateHandle(); if(S.nbOpen) renderNb(); }
function renderTalk(){
  const id=S.talking, c=C.chars[id], isSus=!!C.suspects[id];
  frame({ cls:"nopad", top:backBtn("Everyone","clearInterval(typer);S.screen='scene';render()")+`<div class="ttl">${isSus?"Suspect":"Witness"} · ${c.name} <span class="dim">· ${c.role}</span></div>`,
    main:`<div class="stage talk" onclick="tapBox()">${sceneSvg(C.bg)}
      <div class="actor" style="transition:opacity .11s" data-mood="${(S.beats&&S.beats[Math.max(0,S.bi)]&&S.beats[Math.max(0,S.bi)].mood)||"neutral"}">${portrait(c,(S.beats&&S.beats[Math.max(0,S.bi)]&&S.beats[Math.max(0,S.bi)].mood)||"neutral",false)}</div>
      <div class="banner" id="banner"></div>
      <div class="menu" id="menu"></div>
      <div class="tbox" id="tbox"><span class="name">${c.name}</span><div class="txt"></div><span class="adv">▼</span></div>
    </div>`,
    tabs:tabsFor("talk") });
  if(S.bi>=0&&S.bi<S.beats.length){ S.typing=false; const b=S.beats[S.bi]; S.cur=b; const box=$("tbox"); box.querySelector(".name").textContent=b.who==="you"?"You":C.chars[b.who].name; box.querySelector(".name").className="name "+(b.who==="you"?"you":""); box.querySelector(".txt").textContent=b.text; if(S.bi===S.beats.length-1) showMenu(); }
}
function evSource(k){ for(const [wid,w] of Object.entries(C.witnesses)){ const q=w.questions.find(q=>q.ev===k); if(q) return `${C.chars[wid].name}: “${q.q}”`; } return ""; }
function renderNbReview(){
  const sh=$("sheet"), missEv=Object.keys(C.evidence).filter(k=>!S.found.includes(k));
  const wrongN=ALL.filter(st=>S.marks[st.id]!==st.answer).length;
  const tabs=`<div class="tabs"><button class="${S.nbTab==='evidence'?'on':''}" onclick="S.nbTab='evidence';renderNb()">Evidence (${S.found.length}/${Object.keys(C.evidence).length})</button>
    <button class="${S.nbTab==='suspects'?'on':''}" onclick="S.nbTab='suspects';renderNb()">Suspects${wrongN?` (${wrongN} wrong)`:''}</button></div>`;
  let body;
  if(S.nbTab==="evidence"){
    body=`<p class="rvhint">Case closed. Here is every card${missEv.length?`, and the ${missEv.length} you missed`:''}.</p>`+Object.keys(C.evidence).map((k,i)=>{ const e=C.evidence[k], got=S.found.includes(k);
      return `<div class="ev ${got?'':'missed'}"><span class="pol" style="transform:rotate(${i%2?3:-3}deg)"><img class="p" src="assets/ui/prop_${i%3}.webp" alt="">${icon(e.icon)}</span><div><b>${k}</b> ${e.text}${got?'':`<span class="rvtag">Missed · ask ${evSource(k)}</span>`}</div></div>`; }).join("")
      + S.notes.map(n=>`<div class="ev note">${ICONS.note}<div>${n}</div></div>`).join("");
  } else {
    body=`<p class="rvhint">Your mark next to the right answer, with the card that proves it.</p>`+Object.keys(C.suspects).map(sid=>`<h3>${C.chars[sid].name}${sid===C.culprit?' · did it':''}</h3>`+C.suspects[sid].questions.map(q=>q.s).map(st=>{
      const m=S.marks[st.id], ok=m===st.answer, heard=S.stmts.includes(st.id);
      return `<div class="st rv ${ok?'ok':'bad'}"><span class="dot ${st.answer}"></span>“${st.text}”
        <div class="rvline"><span class="tag ${st.answer}">${LABEL[st.answer]}</span> ${ok?'<span class="ok">You got it</span>':`<span class="bad">${heard?(m?'You said '+LABEL[m]:'Not marked'):'Not asked'}</span>`}<br><span class="dim">${st.reason}</span></div></div>`; }).join("")).join("");
  }
  sh.innerHTML=`<div class="hd"><b>Notes<small class="nbrank">Review</small></b>${tabs}<button class="x" onclick="closeNb()" aria-label="Close">›</button></div><div class="bd">${body}</div>`;
}
function renderNb(){
  if(S.screen==="result") return renderNbReview();
  const sh=$("sheet");
  const tabs=`<div class="tabs"><button class="${S.nbTab==='evidence'?'on':''}" onclick="S.nbTab='evidence';renderNb()">Evidence (${S.found.length})</button>
    <button class="${S.nbTab==='suspects'?'on':''}" onclick="S.nbTab='suspects';renderNb()">Suspects (${S.stmts.length})</button></div>`;
  let body="";
  if(S.nbTab==="evidence"){
    body=(S.found.length?S.found.map((k,i)=>{const e=C.evidence[k];return `<div class="ev ${S.hl.includes(k)?'hl':''}"><span class="pol" style="transform:rotate(${i%2?3:-3}deg)"><img class="p" src="assets/ui/prop_${i%3}.webp" alt="">${icon(e.icon)}</span><div><b>${k}</b> ${e.text}</div></div>`;}).join("")
      :`<p class="dim">Nothing yet. Talk to the witnesses.</p>`) + S.notes.map(n=>`<div class="ev note">${ICONS.note}<div>${n}</div></div>`).join("");
  } else {
    body=Object.keys(C.suspects).map(sid=>{
      const mine=C.suspects[sid].questions.map(q=>q.s).filter(s=>S.stmts.includes(s.id));
      if(!mine.length) return "";
      return `<h3>${C.chars[sid].name}</h3>`+mine.map(st=>`<div class="st ${S.hl.includes(st.id)?'hl':''}"><span class="dot ${S.marks[st.id]||''}"></span>“${st.text}”
        <div class="marks">${["fact","lie","unknown"].map(v=>`<button class="${v} ${S.marks[st.id]===v?'on':''}" onclick="setMark('${st.id}','${v}')">${LABEL[v]}</button>`).join("")}</div></div>`).join("");
    }).join("")||`<p class="dim">No statements yet. Question the suspects.</p>`;
  }
  sh.innerHTML=`<div class="hd"><b>Notes<small class="nbrank">${rankObj().name}</small></b>${tabs}<button class="x" onclick="closeNb()" aria-label="Close">›</button></div><div class="bd">${body}</div>`;
}

function renderVerdict(){
  const cap=3-S.misses;
  frame({ top:backBtn("Scene","S.screen='scene';render()")+`<div class="ttl">Verdict</div>`,
    main:`<h1>Who did it?</h1><p class="sub">Best result still possible: <span class="gold">${"★".repeat(cap)}${"☆".repeat(3-cap)}</span></p>
    ${S.lastWrong?`<div class="card wrongcard"><div class="row2">${portrait(C.chars[S.lastWrong],moodOf(S.lastWrong,"wrong"))}<div class="bubble">${C.suspects[S.lastWrong].wrong}</div></div><p class="sub">The clearing clue is highlighted in your notebook.</p></div>`:""}
    <div class="pick">${Object.keys(C.suspects).map(id=>`<button class="${S.accused===id?'on':''}" onclick="S.accused='${id}';render()">${portrait(C.chars[id])}<div><b>${C.chars[id].name}</b><br><span class="dim">${C.chars[id].role}</span></div></button>`).join("")}</div>
    <button class="btn big" ${S.accused?"":"disabled"} onclick="confirmVerdict()">Confirm accusation</button>`,
    tabs:tabsFor("verdict") });
}
function confirmVerdict(){
  if(S.accused===C.culprit){ S.screen="result"; render(); return; }
  S.misses++; S.lastWrong=S.accused; S.hl=C.suspects[S.accused].clear||[]; S.accused=null;
  if(S.misses>=3){ S.screen="result"; render(); return; }
  render(); toast("Wrong. Check the highlighted clue.");
}
function renderResult(){
  let score=0, wrong=0; const F=fileOf(C.n), wasDone=F?fileDone(F):true;
  const rows=Object.keys(C.suspects).map(sid=>{
    const items=C.suspects[sid].questions.map(q=>q.s).map(st=>{
      const m=S.marks[st.id], a=st.answer; let pts;
      if(m===a) pts=SCORE.correct; else if(m==="unknown") pts=SCORE.cautious; else if(a==="unknown") pts=SCORE.overconfident; else pts=SCORE.swapped;
      score+=pts; if(m!==a) wrong++;
      return `<div class="row"><p>“${st.text}”</p><div class="res"><span class="tag ${a}">${LABEL[a]}</span><div><span class="${m===a?'ok':'bad'}">${m===a?'Correct':'You said '+LABEL[m]} (${pts>0?'+':''}${pts})</span><br>${st.reason}</div></div></div>`;
    }).join("");
    return `<div class="card"><div class="row2">${portrait(C.chars[sid], sid===C.culprit?"nervous":"happy")}<h2>${C.chars[sid].name}${sid===C.culprit?" — did it":""}</h2></div>${items}</div>`;
  }).join("");
  const solved=S.misses<3; if(solved) score+=SCORE.culprit;
  let stars=0; if(solved){ stars=wrong===0?3:wrong<=3?2:1; stars=Math.min(stars,3-S.misses); }
  const max=ALL.length*SCORE.correct+SCORE.culprit;
  const prev=progress[C.id]||{}; if((prev.stars||0)<stars||(prev.score||0)<score){ progress[C.id]={stars:Math.max(prev.stars||0,stars),score:Math.max(prev.score||0,score)}; saveProgress(); }
  const msg=stars===3?"Perfect deduction.":stars===2?"Solved, with a few slips.":stars===1?"Solved, but check your notes next time.":"Case failed.";
  const nc=CASES[C.n], next=nc&&caseReady(nc)&&fileOpen(fileOf(nc.n)||FILES[0])&&caseOpen(nc)?nc:null;
  const promo=F&&!wasDone&&fileDone(F)&&!S.promoShown; if(promo) S.promoShown=true;
  frame({ top:backBtn("Cases","goHome()")+`<div class="ttl">Case ${C.n} closed</div>`,
    main:`<h1>${msg}</h1>
    <div class="card center"><div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">★</span>`).join("")}</div>
      <div class="score">${score} <span class="dim">/ ${max}</span></div>
      <div class="dim">${ALL.length-wrong}/${ALL.length} statements right · ${S.misses} wrong accusation${S.misses===1?"":"s"}</div></div>
    <h2>What really happened</h2><div class="card">${C.reveal.map(p=>`<p>${p}</p>`).join("")}</div>${C.tip?`<div class="tipbox"><b>Detective tip:</b> ${C.tip}</div>`:""}
    <h2>Your board</h2>${rows}`,
    tabs:`<button class="tab" onclick="S.nbTab='suspects';openNb()">${ICONS.note}<span>Review notes</span></button><button class="tab" onclick="loadCase(C)">${ICONS.replay}<span>Replay</span></button><button class="tab" onclick="goHome()">${ICONS.home}<span>Cases</span></button>${next?`<button class="tab on" onclick="loadCase(CASES[${C.n}])">${ICONS.next}<span>Next case</span></button>`:""}` });
  if(promo) setTimeout(()=>document.body.insertAdjacentHTML("beforeend",promoHtml(F)),700);
}
render();

/* full screen: Fullscreen API where the browser allows it (Android, desktop, iPad); iPhone uses Add to Home Screen */
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
function fsOk(){ const d=document.documentElement; return !!((document.fullscreenEnabled||document.webkitFullscreenEnabled)&&(d.requestFullscreen||d.webkitRequestFullscreen)); }
function lockLand(){ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }
function goFull(){ const d=document.documentElement, r=d.requestFullscreen||d.webkitRequestFullscreen; if(!r||fsEl()) return; try{ const pr=r.call(d,{navigationUI:"hide"}); if(pr&&pr.then) pr.then(lockLand).catch(()=>{}); else lockLand(); }catch(e){} }
function toggleFull(){ if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else goFull(); }
function updFs(){ const b=document.getElementById('fsbtn'); if(!b) return; const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone; b.classList.toggle('on',fsOk()&&!standalone);
  b.innerHTML=fsEl()?'<svg viewBox="0 0 24 24" fill="none" stroke="#2a2418" stroke-width="2.4" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#2a2418" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'; }
document.addEventListener('fullscreenchange',updFs); document.addEventListener('webkitfullscreenchange',updFs); updFs();
// first tap on a phone: go full screen and lock landscape
document.addEventListener('click',function first(e){ if(e.target.closest('#fsbtn')) return; if(matchMedia('(pointer:coarse)').matches) goFull(); },{once:true});

if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }

</script>
